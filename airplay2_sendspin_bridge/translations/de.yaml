configuration:
  ap2_ip:
    name: Eigene IP für AirPlay
    description: >-
      Freie IP mit Präfix im Netz von HA, z. B. 192.168.1.240/24. Hier laufen nqptp und die
      AirPlay-Lautsprecher, damit sie sich nicht mit Music Assistant um UDP 319/320
      streiten. Funktioniert nur, wenn HA per Kabel angeschlossen ist.
  ap2_gateway:
    name: Gateway
    description: Leer lassen = Gateway des HA-Hosts.
  ap2_interface:
    name: Netzwerkschnittstelle
    description: Leer lassen = Schnittstelle der Standardroute (z. B. enp0s18).
  latency_ms:
    name: Puffer (ms)
    description: >-
      So viel früher gibt shairport-sync den Ton heraus und so viel später
      spielt ihn der Lautsprecher. Höher = robuster gegen WLAN-Aussetzer.
  sendspin_port:
    name: Sendspin-Port
    description: Port des eigenen Sendspin-Servers (nicht 8927, den nutzt Music Assistant).
  idle_timeout_s:
    name: Freigabe nach (s)
    description: Nach so vielen Sekunden ohne Ton geht der Lautsprecher zurück an Music Assistant.
  volume_range_db:
    name: AirPlay-Lautstärkebereich (dB)
    description: >-
      Spanne zwischen leisestem und lautestem Regler-Wert. Kleiner = in der
      Reglermitte lauter (30 passt meist zu HomePod/Sonos).
  ignore_airplay_volume:
    name: AirPlay-Lautstärke ignorieren
    description: Immer volle Lautstärke weitergeben, geregelt wird nur am Lautsprecher.
  speaker_volume:
    name: Lautsprecher-Lautstärke bei AirPlay (%)
    description: >-
      Auf diesen Wert stellt das Add-on den Lautsprecher selbst, solange AirPlay
      spielt; danach kommt der alte Wert zurück. Geregelt wird dann über
      AirPlay. 0 = Lautsprecher-Lautstärke nicht anfassen.
  lower_volume_during_voice:
    name: Leiser bei Sprachassistent
    description: >-
      Solange der Sprachassistent des Lautsprechers zuhört oder antwortet,
      bekommt er seine alte Lautstärke zurück, damit die Antwort nicht mit
      AirPlay-Lautstärke kommt. Findet den Satelliten über token_entity.
  report_model:
    name: Echtes Modell melden
    description: >-
      Meldet AirPlay das echte Modell und den Hersteller (z. B. „Echo 2“ von
      Amazon) statt „ShairportSync“, sichtbar in Log und Seite. Das Symbol im
      AirPlay-Menü ändert das nicht (iOS kennt Echos nicht). Wirkt nach einem
      Neustart.
  airplay_icon:
    name: Symbol im AirPlay-Menü (Experiment)
    description: >-
      „standard“ = Lautsprecher mit Wellen. „airport_express“ meldet allen
      Lautsprechern die Kennung einer AirPort Express, deren Symbol iOS kennt.
      Nur das Symbol, keine weiteren Funktionen; iOS zeigt nach dem Verbinden
      teils wieder das Standardsymbol. Wirkt nach einem Neustart.
  icon_model:
    name: Eigene Modellkennung (Experiment)
    description: >-
      Freie Modellkennung für alle Lautsprecher, z. B. die eines anderen
      AirPlay-Lautsprechers. Gilt vor „Symbol im AirPlay-Menü“. Leer = aus.
      Wirkt nach einem Neustart.
  icon_manufacturer:
    name: Eigener Hersteller (Experiment)
    description: >-
      Hersteller passend zur eigenen Modellkennung. Leer = keiner.
  metadata:
    name: Titel und Cover weitergeben
    description: >-
      Titel, Interpret, Album und Cover aus AirPlay an den Lautsprecher (Geräte
      mit Bildschirm) und an Home Assistant.
  log_level:
    name: Log-Level
  zones:
    name: Lautsprecher
    description: >-
      Pro Lautsprecher ein Eintrag: name (so erscheint er in AirPlay), host (IP),
      port (echo-dot-assist: 28928), path (/sendspin), pairing_token oder
      token_entity (Entität „Sendspin pairing token“, muss aktiviert sein),
      latency_offset_ms (Feinabgleich, + = später), volume_trim_db
      (Lautstärke-Anpassung, 0 bis −30 dB). Optional satellite_entity
      (assist_satellite.*, sonst automatisch). Stereo-Paar: partner_host (+
      partner_port, partner_path, partner_pairing_token oder
      partner_token_entity) – dann spielt host links, partner_host rechts.
