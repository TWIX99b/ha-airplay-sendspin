configuration:
  ap2_ip:
    name: Dedicated AirPlay IP
    description: >-
      Free IP with prefix in HA's network, e.g. 192.168.1.240/24. nqptp and the AirPlay speakers
      run here so they don't clash with Music Assistant on UDP 319/320.
      Requires a wired connection.
  ap2_gateway:
    name: Gateway
    description: Empty = the host's gateway.
  ap2_interface:
    name: Network interface
    description: Empty = interface of the default route.
  latency_ms:
    name: Buffer (ms)
    description: How early shairport-sync releases audio and how much later the speaker plays it.
  sendspin_port:
    name: Sendspin port
    description: Port of the bridge's own Sendspin server (not 8927, Music Assistant uses it).
  idle_timeout_s:
    name: Release after (s)
    description: Seconds without audio before the speaker is handed back to Music Assistant.
  volume_range_db:
    name: AirPlay volume range (dB)
    description: Range between the quietest and loudest slider value. Smaller = louder mid-slider.
  ignore_airplay_volume:
    name: Ignore AirPlay volume
    description: Always pass full volume, control loudness on the speaker only.
  speaker_volume:
    name: Speaker volume during AirPlay (%)
    description: >-
      The add-on sets the speaker itself to this value while AirPlay plays and
      restores the old value afterwards; loudness is then controlled via
      AirPlay. 0 = don't touch the speaker volume.
  lower_volume_during_voice:
    name: Quieter for the voice assistant
    description: >-
      While the speaker's voice assistant listens or answers, the speaker gets
      its old volume back, so the reply doesn't come at AirPlay volume. Finds
      the satellite via token_entity.
  report_model:
    name: Report the real model
    description: >-
      Tells AirPlay the real model and manufacturer (e.g. "Echo 2" by Amazon)
      instead of "ShairportSync". iOS picks the icon in the AirPlay menu from
      it. Takes effect after a restart.
  metadata:
    name: Pass on title and cover
    description: >-
      Title, artist, album and cover from AirPlay to the speaker (models with a
      screen) and to Home Assistant.
  log_level:
    name: Log level
  zones:
    name: Speakers
    description: >-
      One entry per speaker: name (shown in AirPlay), host (IP), port
      (echo-dot-assist: 28928), path (/sendspin), pairing_token or token_entity
      (entity "Sendspin pairing token", must be enabled), latency_offset_ms
      (fine tuning, + = later), volume_trim_db (volume trim, 0 to −30 dB).
      Optional satellite_entity (assist_satellite.*, otherwise automatic).
      Stereo pair: partner_host (+ partner_port, partner_path,
      partner_pairing_token or partner_token_entity) – then host plays left,
      partner_host right.
