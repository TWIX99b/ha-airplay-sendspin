<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AirPlay Bridge</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg:#f3f4f8; --card:#fff; --fg:#161a26; --muted:#6b7280; --acc:#4f46e5; --acc2:#7c3aed;
    --ok:#15803d; --okbg:#dcfce7; --warn:#c2410c; --warnbg:#ffedd5; --bad:#b91c1c; --badbg:#fee2e2;
    --bd:#e5e7eb; --soft:#eef0f7; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1117; --card:#181b24; --fg:#e9ebf2; --muted:#9aa2b4; --acc:#818cf8; --acc2:#a78bfa;
      --ok:#4ade80; --okbg:#14361f; --warn:#fb923c; --warnbg:#3a2313; --bad:#f87171; --badbg:#3b1717;
      --bd:#272b37; --soft:#20242f; --shadow:none; }
    header { background:linear-gradient(135deg,#3730a3,#5b21b6) !important; }
    .tabs button.active { color:#0f1117 !important; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#fff; padding:22px 16px 56px; }
  header .in { max-width:980px; margin:0 auto; display:flex; align-items:center; gap:14px; }
  header .logo { width:44px; height:44px; border-radius:12px; background:rgba(255,255,255,.18); display:grid; place-items:center; font-size:24px; }
  header h1 { font-size:1.35rem; margin:0; }
  header p { margin:2px 0 0; opacity:.85; font-size:.92rem; }
  main { max-width:980px; margin:-38px auto 0; padding:0 16px 56px; }
  .tabs { display:inline-flex; background:var(--card); border-radius:12px; padding:4px; box-shadow:var(--shadow); border:1px solid var(--bd); margin-bottom:18px; }
  .tabs button { background:transparent; color:var(--muted); margin:0; padding:8px 18px; border-radius:9px; font-weight:600; }
  .tabs button.active { background:var(--acc); color:#fff; }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:16px; padding:16px 18px; margin:14px 0; box-shadow:var(--shadow); }
  .card h2 { font-size:1.02rem; margin:0 0 10px; }
  h3.sec { font-size:1.1rem; margin:26px 0 2px; }
  section > h3.sec:first-child { margin-top:4px; }
  .sub { color:var(--muted); margin:0 0 6px; }
  ol { margin:0; padding-left:1.2em; } li { margin:4px 0; }
  select, button, input { font:inherit; border-radius:10px; }
  select, input { padding:9px 11px; border:1px solid var(--bd); background:var(--card); color:var(--fg); width:100%; }
  input:focus, select:focus { outline:2px solid var(--acc); outline-offset:-1px; }
  button { padding:9px 16px; border:0; background:var(--acc); color:#fff; cursor:pointer; margin:4px 6px 4px 0; font-weight:550; }
  button.sec { background:transparent; color:var(--acc); border:1px solid var(--acc); }
  button.ghost { background:var(--soft); color:var(--fg); }
  button.danger { background:transparent; color:var(--bad); border:1px solid var(--bad); }
  button:disabled { opacity:.45; cursor:default; }
  .pill { white-space:nowrap; flex:none; display:inline-flex; align-items:center; gap:6px; padding:2px 10px; border-radius:99px; font-size:.82rem; font-weight:600; }
  .pill::before { content:''; width:7px; height:7px; border-radius:50%; background:currentColor; }
  .on { background:var(--okbg); color:var(--ok); } .off { background:var(--soft); color:var(--muted); }
  .err { background:var(--badbg); color:var(--bad); }
  .bar { height:10px; background:var(--soft); border-radius:99px; overflow:hidden; margin:10px 0 4px; }
  .bar > div { height:100%; width:0; background:var(--acc); transition:width .25s linear; }
  .big { font-size:1.5rem; font-weight:650; margin:6px 0; }
  .muted { color:var(--muted); font-size:.9rem; }
  .ok { color:var(--ok); } .warn { color:var(--warn); }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
  code { background:var(--soft); padding:1px 6px; border-radius:6px; }
  a { color:var(--acc); }
  .player { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:6px 0 2px; }
  .player button { margin:0; padding:7px 14px; }
  .calsel { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .calsel select { width:auto; min-width:220px; }
  /* speaker tiles */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px; }
  .tile { background:var(--card); border:1px solid var(--bd); border-radius:18px; padding:16px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px; min-height:210px; }
  .tile.playing { border-color:var(--acc); }
  .tile .top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .tile .name { font-weight:700; font-size:1.08rem; }
  .tile .meta { color:var(--muted); font-size:.85rem; }
  .now { display:flex; gap:10px; align-items:center; background:var(--soft); border-radius:12px; padding:8px; min-height:58px; }
  .now img, .now .ph { width:42px; height:42px; border-radius:8px; object-fit:cover; flex:none; }
  .now .ph { display:grid; place-items:center; background:var(--bd); color:var(--muted); font-size:20px; }
  .now .t { font-weight:600; font-size:.9rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .now .a { color:var(--muted); font-size:.82rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .now > div { min-width:0; }
  .stats { display:flex; gap:8px; flex-wrap:wrap; }
  .stat { background:var(--soft); border-radius:10px; padding:5px 10px; font-size:.82rem; }
  .stat b { font-size:.95rem; }
  .badge { font-size:.75rem; font-weight:700; color:var(--acc); background:var(--soft); border-radius:6px; padding:1px 7px; }
  .tile .actions { margin-top:auto; display:flex; gap:6px; }
  .tile .actions button { margin:0; flex:1; padding:8px 10px; }
  .addtile { border:2px dashed var(--bd); background:transparent; box-shadow:none; color:var(--muted); align-items:center; justify-content:center; cursor:pointer; font-weight:650; }
  .addtile:hover { border-color:var(--acc); color:var(--acc); }
  .addtile .plus { font-size:34px; line-height:1; }
  /* dialog */
  dialog { border:0; border-radius:18px; padding:0; width:min(560px,94vw); background:var(--card); color:var(--fg); box-shadow:0 20px 60px rgba(0,0,0,.3); }
  dialog::backdrop { background:rgba(10,12,20,.45); }
  .dlg-h { padding:16px 18px 8px; display:flex; justify-content:space-between; align-items:center; }
  .dlg-h h2 { margin:0; font-size:1.1rem; }
  .dlg-b { padding:4px 18px 8px; max-height:68vh; overflow:auto; }
  .dlg-f { padding:10px 18px 16px; display:flex; gap:6px; justify-content:flex-end; flex-wrap:wrap; }
  .dlg-f .grow { margin-right:auto; }
  .x:focus { outline:none; }
  .x { background:transparent; color:var(--muted); font-size:22px; padding:2px 8px; margin:0; }
  .sugg { display:flex; align-items:center; gap:12px; border:1px solid var(--bd); border-radius:12px; padding:10px 12px; margin:8px 0; cursor:pointer; }
  .sugg:hover { border-color:var(--acc); }
  .sugg.used { opacity:.5; cursor:default; }
  .sugg .ic { width:38px; height:38px; border-radius:10px; background:var(--soft); display:grid; place-items:center; font-size:20px; flex:none; }
  .sugg .grow { flex:1; min-width:0; }
  label.f { display:block; margin:12px 0 4px; font-weight:600; font-size:.9rem; }
  .hint { color:var(--muted); font-size:.82rem; margin-top:3px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  details summary { cursor:pointer; color:var(--acc); margin:14px 0 4px; font-weight:600; }
  .overlay { position:fixed; inset:0; background:rgba(10,12,20,.55); display:grid; place-items:center; z-index:50; }
  .overlay .card { max-width:360px; text-align:center; }
  .spin { width:34px; height:34px; border:4px solid var(--soft); border-top-color:var(--acc); border-radius:50%; animation:sp 1s linear infinite; margin:6px auto 10px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--fg); color:var(--bg); padding:10px 16px; border-radius:12px; z-index:60; box-shadow:var(--shadow); }
  .empty { text-align:center; padding:30px 10px; color:var(--muted); }
</style>
</head>
<body>
<header><div class="in">
  <div class="logo">🔊</div>
  <div><h1 data-t="appTitle"></h1><p data-t="appSub"></p></div>
</div></header>
<main>
  <div class="tabs">
    <button id="tabBtnSpk" class="active" data-t="tabSpk"></button>
    <button id="tabBtnCal" data-t="tabCal"></button>
  </div>

  <section id="tabSpk">
    <div class="grid" id="tiles"></div>
  </section>

  <section id="tabCal" hidden>
  <h3 class="sec" data-t="title"></h3>
  <p class="sub" data-t="subtitle"></p>

  <div class="card" id="secure" hidden>
    <h2 data-t="noMicTitle"></h2>
    <p data-t="noMicText"></p>
    <button class="sec" onclick="window.open(location.href,'_blank')" data-t="newTab"></button>
  </div>

  <div class="card">
    <h2 data-t="step1"></h2>
    <div class="row">
      <div class="calsel"><select id="zone"></select>
      <span id="state" class="pill off"></span></div>
    </div>
    <p class="muted" id="current"></p>
  </div>

  <div class="card">
    <h2 data-t="step2"></h2>
    <ol>
      <li><span data-t="i1"></span>
        <div class="player">
          <button class="sec play" data-audio="clickAudio" data-t="play"></button>
          <a href="sync-click.wav" download="sync-click.wav" data-t="download"></a>
        </div>
        <span class="muted" data-t="playHint"></span>
        <audio id="clickAudio" src="sync-click.wav" loop preload="none" x-webkit-airplay="allow"></audio>
      </li>
      <li data-t="i2"></li>
      <li data-t="i3"></li>
      <li data-t="i4"></li>
    </ol>
  </div>

  <div class="card">
    <h2 data-t="step3"></h2>
    <button id="start" data-t="start"></button>
    <div class="bar"><div id="prog"></div></div>
    <div class="muted" id="phase"></div>
  </div>

  <div class="card" id="result" hidden>
    <h2 data-t="result"></h2>
    <div class="big" id="resBig"></div>
    <div id="resText"></div>
    <div class="muted" id="resQual"></div>
    <div class="row" style="margin-top:10px">
      <button id="apply" data-t="apply"></button>
      <button class="sec" id="again" data-t="again"></button>
    </div>
    <div class="muted" id="applied"></div>
  </div>

  <div class="card">
    <h2 data-t="manual"></h2>
    <div class="row">
      <button class="sec" data-step="-20">−20 ms</button>
      <button class="sec" data-step="-5">−5 ms</button>
      <button class="sec" data-step="5">+5 ms</button>
      <button class="sec" data-step="20">+20 ms</button>
      <button id="saveManual" data-t="save"></button>
    </div>
    <p class="muted" data-t="manualHint"></p>
  </div>

  <h3 class="sec" data-t="lvTitle"></h3>
  <p class="sub" data-t="lvSub"></p>

  <div class="card">
    <h2 data-t="lvPrep"></h2>
    <p class="muted" id="lvCurrent"></p>
    <ol>
      <li><span data-t="l1"></span>
        <div class="player">
          <button class="sec play" data-audio="levelAudio" data-t="play"></button>
          <a href="level-noise.wav" download="level-noise.wav" data-t="lvDownload"></a>
        </div>
        <audio id="levelAudio" src="level-noise.wav" loop preload="none" x-webkit-airplay="allow"></audio>
      </li>
      <li data-t="l2"></li>
      <li data-t="l3"></li>
      <li data-t="l4"></li>
    </ol>
  </div>

  <div class="card">
    <h2 data-t="lvMeasure"></h2>
    <button id="lvStart" data-t="start"></button>
    <div class="bar"><div id="lvProg"></div></div>
    <div class="muted" id="lvPhase"></div>
  </div>

  <div class="card" id="lvResult" hidden>
    <h2 data-t="result"></h2>
    <div class="big" id="lvBig"></div>
    <div id="lvText"></div>
    <div class="muted" id="lvQual"></div>
    <div class="row" style="margin-top:10px">
      <button id="lvApply" data-t="apply"></button>
      <button class="sec" id="lvAgain" data-t="again"></button>
    </div>
    <div class="muted" id="lvApplied"></div>
  </div>

  <div class="card">
    <h2 data-t="lvManual"></h2>
    <div class="row">
      <button class="sec" data-trim="-3">−3 dB</button>
      <button class="sec" data-trim="-1">−1 dB</button>
      <button class="sec" data-trim="1">+1 dB</button>
      <button class="sec" data-trim="3">+3 dB</button>
      <button id="lvSave" data-t="save"></button>
    </div>
    <p class="muted" data-t="lvManualHint"></p>
  </div>
  </section>
</main>

<dialog id="dlgAdd">
  <div class="dlg-h"><h2 data-t="addTitle"></h2><button class="x" data-close>×</button></div>
  <div class="dlg-b">
    <p class="muted" data-t="addHint"></p>
    <div id="suggList"></div>
  </div>
  <div class="dlg-f">
    <button class="ghost grow" id="addManual" data-t="addManual"></button>
    <button class="sec" data-close data-t="cancel"></button>
  </div>
</dialog>

<dialog id="dlgEdit">
  <form method="dialog" id="editForm" autocomplete="off">
  <div class="dlg-h"><h2 id="editTitle"></h2><button type="button" class="x" data-close>×</button></div>
  <div class="dlg-b">
    <label class="f" for="fName" data-t="fName"></label>
    <input id="fName" maxlength="40" required>
    <div class="hint" data-t="fNameHint"></div>

    <label class="f" for="fDevice" data-t="fDevice"></label>
    <select id="fDevice"></select>
    <div class="two">
      <div><label class="f" for="fHost" data-t="fHost"></label><input id="fHost" required></div>
      <div><label class="f" for="fToken" data-t="fTokenEntity"></label><input id="fToken" placeholder="sensor.…_sendspin_pairing_token"></div>
    </div>

    <label class="f" for="fPartner" data-t="fPartner"></label>
    <select id="fPartner"></select>
    <div class="hint" data-t="fPartnerHint"></div>

    <div class="two">
      <div><label class="f" for="fOffset" data-t="fOffset"></label><input id="fOffset" type="number" min="-1000" max="1000" step="5"></div>
      <div><label class="f" for="fTrim" data-t="fTrim"></label><input id="fTrim" type="number" min="-30" max="0" step="0.5"></div>
    </div>
    <div class="hint" id="knownHint"></div>

    <details>
      <summary data-t="advanced"></summary>
      <div class="two">
        <div><label class="f" for="fPort" data-t="fPort"></label><input id="fPort" type="number" min="1" max="65535"></div>
        <div><label class="f" for="fPath" data-t="fPath"></label><input id="fPath"></div>
      </div>
      <label class="f" for="fPairing" data-t="fPairing"></label>
      <input id="fPairing" type="password" autocomplete="new-password">
      <div class="hint" id="pairingHint"></div>
      <label class="f" for="fSat" data-t="fSat"></label>
      <input id="fSat" placeholder="assist_satellite.…">
      <div id="partnerAdv" hidden>
        <div class="two">
          <div><label class="f" for="fPHost" data-t="fPHost"></label><input id="fPHost"></div>
          <div><label class="f" for="fPToken" data-t="fPToken"></label><input id="fPToken"></div>
        </div>
        <label class="f" for="fPSat" data-t="fPSat"></label>
        <input id="fPSat" placeholder="assist_satellite.…">
      </div>
    </details>
    <div class="hint warn" id="editErr"></div>
  </div>
  <div class="dlg-f">
    <button type="button" class="danger grow" id="btnDelete" data-t="delete"></button>
    <button type="button" class="sec" data-close data-t="cancel"></button>
    <button type="submit" id="btnSave" data-t="saveSpk"></button>
  </div>
  </form>
</dialog>

<script>
const DE = navigator.language.toLowerCase().startsWith('de');
const T = DE ? {
  appTitle: 'AirPlay Bridge',
  appSub: 'Echos als AirPlay-2-Lautsprecher – verwalten und einmessen',
  tabSpk: 'Lautsprecher', tabCal: 'Einmessen',
  stPlaying: 'spielt', stReady: 'bereit', stUnpaired: 'nicht gekoppelt', stRestart: 'Neustart nötig',
  nothing: 'Gerade läuft nichts über AirPlay',
  offset: 'Versatz', volume: 'Lautstärke', speakerVol: 'Echo',
  stereo: 'Stereo-Paar', left: 'links', right: 'rechts',
  edit: 'Bearbeiten', calibrate: 'Einmessen',
  addTile: 'Lautsprecher hinzufügen',
  empty: 'Noch keine Lautsprecher. Tippe auf „Lautsprecher hinzufügen“ – die Seite schlägt deine Echos aus Home Assistant vor.',
  addTitle: 'Lautsprecher hinzufügen',
  addHint: 'Diese Geräte hat Home Assistant gefunden. Antippen zum Übernehmen:',
  addManual: 'Von Hand eintragen', cancel: 'Abbrechen',
  noneFound: 'Keine Echos mit echo-dot-assist gefunden. Die Entität „Sendspin pairing token“ muss aktiviert sein.',
  already: 'schon eingerichtet', noToken: 'Token-Entität deaktiviert',
  editTitle: 'Lautsprecher bearbeiten', newTitle: 'Neuer Lautsprecher',
  fName: 'Name in AirPlay', fNameHint: 'So erscheint der Lautsprecher auf iPhone, iPad und Mac.',
  fDevice: 'Echo', manualDevice: '– von Hand –',
  fHost: 'IP-Adresse', fTokenEntity: 'Token-Entität',
  fPartner: 'Stereo-Partner (rechter Kanal)', noPartner: 'kein – spielt Stereo allein',
  fPartnerHint: 'Mit Partner spielt dieser Echo links und der Partner rechts.',
  fOffset: 'Feinabgleich (ms)', fTrim: 'Lautstärke (dB)',
  known: (m, v) => `Bekannter Wert für ${m}: ${v} ms`, useKnown: 'übernehmen',
  advanced: 'Erweitert', fPort: 'Port', fPath: 'Pfad',
  fPairing: 'Pairing-Token (statt Entität)', pairingSet: 'Ein Token ist gespeichert. Leer lassen = behalten.',
  fSat: 'Sprachassistent (leer = automatisch)',
  fPHost: 'Partner-IP', fPToken: 'Partner-Token-Entität', fPSat: 'Partner-Sprachassistent',
  delete: 'Entfernen', saveSpk: 'Speichern',
  confirmDelete: (n) => `„${n}“ wirklich entfernen?`,
  restarting: 'Übernehme die Änderungen – das Add-on startet neu …',
  restartSlow: 'Das dauert länger als gedacht. Seite gleich neu laden.',
  savedLive: 'Gespeichert.', saveFail: 'Speichern hat nicht geklappt: ',
  title: 'Zeit einmessen',
  subtitle: 'Misst per Mikrofon, wie weit ein Lautsprecher gegenüber einem HomePod/Sonos versetzt ist, und stellt den Versatz automatisch ein.',
  noMicTitle: 'Kein Mikrofonzugriff',
  noMicText: 'Der Browser gibt das Mikrofon nur über HTTPS frei, z. B. über deine externe HA-Adresse. Öffne die Seite zur Sicherheit in einem eigenen Tab.',
  newTab: 'In neuem Tab öffnen',
  step1: '1 · Lautsprecher wählen', playing: 'spielt über AirPlay', idle: 'spielt gerade nicht',
  current: (o) => `Aktueller Feinabgleich: ${o > 0 ? '+' : ''}${o} ms`,
  step2: '2 · Vorbereiten',
  i1: 'Klick-Track hier abspielen oder herunterladen:', download: 'Herunterladen',
  play: '▶ Abspielen', pause: '■ Stoppen',
  playHint: 'Vorher die Audioausgabe des Geräts auf die AirPlay-Gruppe stellen (iPhone/iPad: Kontrollzentrum, Mac: Menüleiste › Ton). Bricht die Wiedergabe beim Messen ab (meldet die Seite), den Track auf einem zweiten Gerät abspielen.',
  interrupted: 'Die AirPlay-Wiedergabe wurde während der Messung unterbrochen – vermutlich durch das Mikrofon. Den Track auf einem anderen Gerät oder mit der Musik-App abspielen und nochmal messen.',
  i2: 'Abgespielt wird per AirPlay auf die Gruppe aus diesem Lautsprecher und einer Referenz (HomePod/Sonos).',
  i3: 'Das Gerät mit dieser Seite ungefähr gleich weit von beiden Lautsprechern entfernt hinlegen, ruhig sein.',
  i4: 'Beide Lautsprecher etwa gleich laut einstellen und auf Messen tippen. Läuft noch nichts, startet die Seite den Klick-Track selbst und stoppt ihn danach.',
  step3: '3 · Messen (ca. 20 Sekunden)', start: 'Messen',
  phA: 'Phase 1/2: Lautsprecher stumm – nur der Referenz-Lautsprecher klickt …',
  phB: 'Phase 2/2: Lautsprecher wieder an – beide klicken …',
  analyse: 'Werte aus …',
  result: 'Ergebnis',
  late: (d) => `Der Lautsprecher ist ${d} ms zu spät`,
  early: (d) => `Der Lautsprecher ist ${d} ms zu früh`,
  fits: (d) => `✓ Passt – Abweichung ${d > 0 ? '+' : ''}${d} ms (Toleranz ±5 ms)`,
  keep: (n) => `Der Feinabgleich von <b>${n > 0 ? '+' : ''}${n} ms</b> bleibt.`,
  confirm: 'Wert bestätigen & speichern',
  confirmed: (n, s) => `Bestätigt: ${n > 0 ? '+' : ''}${n} ms${s ? ' – gespeichert.' : ' – Speichern hat nicht geklappt.'}`,
  suggest: (n) => `Neuer Feinabgleich: <b>${n > 0 ? '+' : ''}${n} ms</b>`,
  qual: (a, b) => `Signalqualität: Referenz ${a.toFixed(1)} · Lautsprecher ${b.toFixed(1)} (gut: Referenz über 4, Lautsprecher über 8)`,

function zone() { return zones.find(z => String(z.index) === $('zone').value); }

async function refresh() {
  try {
    const r = await api('api/zones'); zones = await r.json();
    const sel = $('zone'), keep = sel.value;
    if (sel.options.length !== zones.length) {
      sel.innerHTML = zones.map(z => `<option value="${z.index}">${z.name}</option>`).join('');
      if (keep) sel.value = keep;
    }
    const z = zone(); if (!z) return;
    $('state').textContent = z.playing ? T.playing : T.idle;
    $('state').className = 'pill ' + (z.playing ? 'on' : 'off');
    $('current').textContent = T.current(z.offset_ms);
    $('lvCurrent').textContent = T.lvCur(z.trim_db, z.speaker_volume, z.speaker_volume_target);
  } catch (e) { /* ignore, try again */ }
}
$('zone').onchange = refresh;

// ---------- Play the test tracks in the page ----------
function playLabels() {
  document.querySelectorAll('button.play').forEach(b => {
    b.textContent = $(b.dataset.audio).paused ? T.play : T.pause;
  });
}
document.querySelectorAll('button.play').forEach(b => b.onclick = async () => {
  const a = $(b.dataset.audio);
  document.querySelectorAll('audio').forEach(o => { if (o !== a) o.pause(); });
  if (a.paused) { try { await a.play(); } catch (e) { alert(e.message); } } else { a.pause(); a.currentTime = 0; }
  playLabels();
});
document.querySelectorAll('audio').forEach(a => { a.onplay = a.onpause = playLabels; });
// Start the right track for a measurement, unless something else already
// plays on the speaker (e.g. the Music app or a second device).
async function ensureTrack(z, audioId, phaseEl) {
  const a = $(audioId), others = [...document.querySelectorAll('audio')].filter(o => o !== a);
  const pagePlays = !a.paused || others.some(o => !o.paused);
  if (z.playing && !pagePlays) return { ok: true, started: false };
  others.forEach(o => o.pause());
  let started = false;
  if (a.paused) {
    a.currentTime = 0;
    try { await a.play(); started = true; } catch (e) { alert(e.message); return { ok: false, started: false }; }
  }
  playLabels();
  phaseEl.textContent = T.starting;
  if (z.playing) {             // track switched within a running session:
    await sleep(3000);         // let the old track drain out of the AirPlay buffers
    return { ok: true, started };
  }
  for (let i = 0; i < 40; i++) {
    await sleep(500);
    if (await stillPlaying(z.index)) { await sleep(1500); return { ok: true, started }; }
  }
  if (started) { a.pause(); playLabels(); }
  phaseEl.textContent = '';
  return { ok: false, started: false };
}
function stopTrack(audioId, started) {
  if (!started) return;
  const a = $(audioId); a.pause(); a.currentTime = 0; playLabels();
}
async function stillPlaying(index) {
  try { const zs = await (await api('api/zones')).json(); return zs.find(z => z.index === index)?.playing; }
  catch (e) { return true; }
}

function renderTiles() {
  const tiles = cfg.map((c, i) => {
    const z = zones[i] && zones[i].name === c.name ? zones[i] : null;
    const dev = byHost(c.host), pdev = c.partner_host ? byHost(c.partner_host) : null;
    const meta = [dev?.model_name, dev?.area].filter(Boolean).join(' · ') || c.host;
    const unpaired = z && z.speakers.some(s => !s.paired);
    let pill = `<span class="pill off">${T.stRestart}</span>`;
    if (z) pill = z.playing ? `<span class="pill on">${T.stPlaying}</span>`
      : unpaired ? `<span class="pill err">${T.stUnpaired}</span>` : `<span class="pill off">${T.stReady}</span>`;
    const tr = z && z.playing && z.track;
    const cover = tr && z.cover ? `<img src="api/zones/${i}/cover?k=${z.cover}" alt="">` : '<div class="ph">♪</div>';
    const now = tr && (tr.title || tr.artist)
      ? `<div class="now">${cover}<div><div class="t">${esc(tr.title)}</div><div class="a">${esc(tr.artist)}</div></div></div>`
      : `<div class="now"><div class="ph">${z && z.playing ? '♪' : '⏸'}</div><div class="a">${z && z.playing ? '' : T.nothing}</div></div>`;
    const pair = c.partner_host
      ? `<span class="badge">${T.stereo}</span> <span class="meta">${T.left}: ${esc(dev?.area || c.host)} · ${T.right}: ${esc(pdev?.area || c.partner_host)}</span>` : '';
    const vol = z && z.playing && z.speaker_volume !== null ? `<div class="stat">${T.speakerVol} <b>${z.speaker_volume} %</b></div>` : '';
    return `<div class="tile${z && z.playing ? ' playing' : ''}">
      <div class="top"><div><div class="name">${esc(c.name)}</div><div class="meta">${esc(meta)}</div></div>${pill}</div>
      ${pair ? `<div>${pair}</div>` : ''}
      ${now}
      <div class="stats"><div class="stat">${T.offset} <b>${sgn(c.latency_offset_ms || 0)} ms</b></div>
        <div class="stat">${T.volume} <b>${fmtDb(c.volume_trim_db || 0)}</b></div>${vol}</div>
      <div class="actions"><button class="ghost" data-edit="${i}">${T.edit}</button>
        <button class="sec" data-cal="${i}" ${z ? '' : 'disabled'}>${T.calibrate}</button></div>
    </div>`;
  });
  tiles.push(`<div class="tile addtile" id="addTile"><div class="plus">＋</div><div>${T.addTile}</div></div>`);
  $('tiles').innerHTML = (cfg.length ? '' : `<div class="card empty" style="grid-column:1/-1">${T.empty}</div>`) + tiles.join('');
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openEdit(Number(b.dataset.edit)));

    $('zone').value = b.dataset.cal; refresh(); showTab('cal'); window.scrollTo(0, 0);
  });
  $('addTile').onclick = openAdd;
}

    port: Number($('fPort').value) || 28928, path: $('fPath').value.trim() || '/sendspin',
    token_entity: $('fToken').value.trim(), satellite_entity: $('fSat').value.trim(),
    latency_offset_ms: Math.round(Number($('fOffset').value) || 0),
    volume_trim_db: Math.round((Number($('fTrim').value) || 0) * 10) / 10,
  };
  if ($('fPairing').value.trim()) z.pairing_token = $('fPairing').value.trim();

  }
  return z;
}
async function saveAll(list) {
  const r = await fetch('api/config', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ zones: list }) });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
const asOrig = () => cfg.map((z, i) => ({ ...z, orig: i }));
async function commit(list) {
  const res = await saveAll(list);
  if (res.restart) await waitRestart();
  else { toast(T.savedLive); await loadConfig(); await refresh(); }
}
$('editForm').onsubmit = async (e) => {
  e.preventDefault();
  const z = formZone(), list = asOrig();
  if (editIdx === null) list.push(z); else list[editIdx] = z;
  $('btnSave').disabled = true;
  try { $('dlgEdit').close(); await commit(list); }
  catch (err) { $('dlgEdit').showModal(); $('editErr').textContent = T.saveFail + err.message; }
  finally { $('btnSave').disabled = false; }
};
$('btnDelete').onclick = async () => {
  if (editIdx === null || !confirm(T.confirmDelete(cfg[editIdx].name))) return;
  const list = asOrig(); list.splice(editIdx, 1);
  try { $('dlgEdit').close(); await commit(list); } catch (err) { alert(T.saveFail + err.message); }
};

async function waitRestart() {
  restartPending = true;
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="card"><div class="spin"></div><div>${T.restarting}</div></div>`;
  document.body.appendChild(ov);
  for (let i = 0; i < 60; i++) {
    await sleep(2000);
    try {
      const r = await fetch('api/config', { cache: 'no-store' });
      if (r.ok && (await r.json()).boot !== boot) { location.reload(); return; }   // new instance is up
    } catch (e) { /* down while restarting */ }
  }
  ov.querySelector('div div:last-child').textContent = T.restartSlow;
}

async function tick() { await refresh(); if (!restartPending) renderTiles(); }
(async () => { await Promise.all([loadConfig(), loadFound()]); await tick(); setInterval(tick, 2500); })();

// ---------- Measurement ----------
const TOL_MS = 5;       // within ±5 ms the offset counts as fitting
const TOL_DB = 1.0;     // within ±1 dB the volume counts as fitting
const BINS = 1000;      // 1 ms resolution over the 1 s click period
const ONSET_WIN = 40;   // ms before the maximum: direct sound comes before reflections
const ONSET_REL = 0.3;  // onset = first crossing of 30 % of the peak
let GUARD_S = 2.5;      // a mute becomes audible only after the bridge buffer
let PHASE_S = 9.0;      // duration of one phase

function envelope(x, sr) {
  const n = x.length, d = new Float32Array(n);
  let prev = 0;
  for (let i = 0; i < n; i++) { d[i] = Math.abs(x[i] - prev); prev = x[i]; }
  const w = Math.max(1, Math.round(sr * 0.0005)), out = new Float32Array(n);
  let acc = 0;
  for (let i = 0; i < n; i++) { acc += d[i]; if (i >= w) acc -= d[i - w]; out[i] = acc / w; }
  return out;
}
function fold(env, sr, a, b) {
  const p = new Float64Array(BINS), c = new Float64Array(BINS);
  for (let i = a; i < b; i++) { const k = Math.floor(((i % sr) / sr) * BINS); p[k] += env[i]; c[k]++; }
  for (let k = 0; k < BINS; k++) p[k] = c[k] ? p[k] / c[k] : 0;
  const s = new Float64Array(BINS);   // circular smoothing ±2 bins
  for (let k = 0; k < BINS; k++) { let v = 0; for (let j = -2; j <= 2; j++) v += p[(k + j + BINS) % BINS]; s[k] = v / 5; }
  return s;
}
function argmax(a) { let m = 0; for (let i = 1; i < a.length; i++) if (a[i] > a[m]) m = i; return m; }
function median(a) { const s = Array.from(a).sort((x, y) => x - y); return s[s.length >> 1]; }
function onset(P) {
  const m = argmax(P), base = median(P), thr = base + ONSET_REL * (P[m] - base);
  for (let j = m - ONSET_WIN; j <= m; j++) { const k = (j + BINS) % BINS; if (P[k] >= thr) return k; }
  return m;
}
function analyse(x, sr, markA, markB, end) {
  const env = envelope(x, sr);
  const A = fold(env, sr, markA + Math.round(GUARD_S * sr), markB);
  const B = fold(env, sr, markB + Math.round(GUARD_S * sr), end);
  const D = new Float64Array(BINS);
  for (let k = 0; k < BINS; k++) D[k] = B[k] - A[k];   // = contribution of the zone
  const s = onset(A), e = onset(D);
  const qa = A[argmax(A)] / (median(A) + 1e-12);
  const qd = D[argmax(D)] / (median(D.map(Math.abs)) + 1e-12);
  let d = ((e - s) * 1000) / BINS;                     // ms, zone − reference
  if (d > 500) d -= 1000; if (d <= -500) d += 1000;
  return { delay: Math.round(d), qa, qd };
}

async function measure() {
  const z = zone();
  $('result').hidden = true; $('applied').textContent = '';
  if (!z) return;
  $('start').disabled = true;
  const track = await ensureTrack(z, 'clickAudio', $('phase'));
  $('start').disabled = false;
  if (!track.ok) { alert(T.notPlaying); return; }
  GUARD_S = z.lead_ms / 1000 + 1.0;          // bridge delay + safety margin
  PHASE_S = Math.max(9.0, GUARD_S + 6.5);    // at least ~6 clicks per phase
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: {
      echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  } catch (e) { stopTrack('clickAudio', track.started); alert(T.micErr + e.message); return; }
  $('start').disabled = true;
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume();
  const sr = ctx.sampleRate, src = ctx.createMediaStreamSource(stream);
  const proc = ctx.createScriptProcessor(4096, 1, 1);
  const chunks = []; let count = 0;
  proc.onaudioprocess = (ev) => { const d = new Float32Array(ev.inputBuffer.getChannelData(0)); chunks.push(d); count += d.length; };
  src.connect(proc); proc.connect(ctx.destination);

  const total = 2 * PHASE_S * 1000, t0 = performance.now();
  const tick = setInterval(() => { $('prog').style.width = Math.min(100, (performance.now() - t0) / total * 100) + '%'; }, 200);
  let markA = 0, markB = 0, end = 0, alive = true;
  try {
    $('phase').textContent = T.phA;
    await api(`api/zones/${z.index}/mute`, { mute: true }); markA = count;
    await sleep(PHASE_S * 1000);
    $('phase').textContent = T.phB;
    await api(`api/zones/${z.index}/mute`, { mute: false }); markB = count;
    await sleep(PHASE_S * 1000);
    end = count;
    alive = await stillPlaying(z.index);
  } finally {
    await api(`api/zones/${z.index}/mute`, { mute: false });
    stopTrack('clickAudio', track.started);
    clearInterval(tick); proc.disconnect(); src.disconnect();
    stream.getTracks().forEach(t => t.stop()); await ctx.close();
    $('start').disabled = false;
  }
  $('phase').textContent = T.analyse;
  const x = new Float32Array(end); let o = 0;
  for (const c of chunks) { if (o >= end) break; x.set(c.subarray(0, Math.min(c.length, end - o)), o); o += c.length; }
  if (!alive) { $('phase').textContent = T.interrupted; return; }
  const r = analyse(x, sr, markA, markB, end);
  $('phase').textContent = '';
  const good = r.qa > 4 && r.qd > 8;
  const fits = good && Math.abs(r.delay) <= TOL_MS;
  suggested = fits ? z.offset_ms : z.offset_ms - r.delay;
  $('resBig').textContent = fits ? T.fits(r.delay) : (r.delay > 0 ? T.late(r.delay) : T.early(-r.delay));
  $('resBig').className = 'big ' + (good ? 'ok' : 'warn');
  $('resText').innerHTML = fits ? T.keep(suggested) : T.suggest(suggested);
  $('resQual').textContent = T.qual(r.qa, r.qd) + (good ? '' : ' — ' + T.bad);
  $('apply').textContent = fits ? T.confirm : T.apply;
  $('apply').disabled = !good;
  $('result').hidden = false;
}

// ---------- Volume matching ----------
const LV_CYCLE = 5.0;   // s, noise 1.5 s + silence 3.5 s
const LV_BINS = 500;    // 10 ms per bin
const LV_EDGE = 15;     // bins ignored at each edge of a block (fade, reverb)
let lvSuggested = null;

function highpass(x, sr, f0) {
  const w = 2 * Math.PI * f0 / sr, al = Math.sin(w) / (2 * Math.SQRT1_2), cw = Math.cos(w), a0 = 1 + al;
  const b0 = (1 + cw) / 2 / a0, b1 = -(1 + cw) / a0, b2 = b0, a1 = -2 * cw / a0, a2 = (1 - al) / a0;
  const y = new Float32Array(x.length); let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
  for (let i = 0; i < x.length; i++) {
    const v = b0 * x[i] + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2;
    x2 = x1; x1 = x[i]; y2 = y1; y1 = v; y[i] = v;
  }
  return y;
}
function analyseLevel(x, sr, from, end) {
  const y = highpass(highpass(x, sr, 150), sr, 150);
  const cyc = sr * LV_CYCLE, E = new Float64Array(LV_BINS), C = new Float64Array(LV_BINS);
  for (let i = from; i < end; i++) {                    // fold every sample onto the 5 s cycle
    const k = Math.floor(((i % cyc) / cyc) * LV_BINS);
    E[k] += y[i] * y[i]; C[k]++;
  }
  const P = new Float64Array(LV_BINS);                  // mean power per bin
  for (let k = 0; k < LV_BINS; k++) P[k] = C[k] ? E[k] / C[k] : 0;
  const L = Array.from(P, p => 10 * Math.log10(p + 1e-20));
  const floor = Array.from(L).sort((a, b) => a - b)[Math.floor(LV_BINS * 0.1)];
  const act = L.map(v => v > floor + 8);
  let s0 = act.indexOf(false);                           // start the walk in a gap
  if (s0 < 0) return { ok: false, snr: 0, runs: [] };
  const runs = []; let cur = null;
  for (let n = 1; n <= LV_BINS; n++) {
    const k = (s0 + n) % LV_BINS;
    if (act[k]) { if (!cur) cur = { start: k, len: 0 }; cur.len++; }
    else if (cur) { runs.push(cur); cur = null; }
  }
  const blocks = runs.filter(r => r.len >= 30).sort((a, b) => a.len - b.len);
  if (blocks.length !== 2) return { ok: false, snr: 0, runs: blocks.map(r => r.len) };
  const level = (r) => {
    let p = 0, c = 0;
    for (let n = LV_EDGE; n < r.len - LV_EDGE; n++) { p += P[(r.start + n) % LV_BINS]; c++; }
    return 10 * Math.log10(p / c + 1e-20);
  };
  const [ref, zone] = blocks;                            // reference 1.5 s, zone 2.0 s
  const lr = level(ref), lz = level(zone);
  const snr = Math.min(lr, lz) - floor;
  const ok = ref.len >= 120 && ref.len <= 210 && zone.len >= 170 && zone.len <= 270 && zone.len - ref.len >= 25;
  return { ok, diff: lz - lr, snr, runs: [ref.len, zone.len] };
}

async function measureLevel() {
  const z = zone();
  $('lvResult').hidden = true; $('lvApplied').textContent = '';
  if (!z) return;
  $('lvStart').disabled = true;
  const track = await ensureTrack(z, 'levelAudio', $('lvPhase'));
  $('lvStart').disabled = false;
  if (!track.ok) { alert(T.notPlaying); return; }
  const guard = z.lead_ms / 1000 + 1.0 + LV_CYCLE;       // bridge delay + one full cycle
  const meas = 4 * LV_CYCLE;
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: {
      echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  } catch (e) { stopTrack('levelAudio', track.started); alert(T.micErr + e.message); return; }
  $('lvStart').disabled = true;
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume();
  const sr = ctx.sampleRate, src = ctx.createMediaStreamSource(stream);
  const proc = ctx.createScriptProcessor(4096, 1, 1);
  const chunks = []; let count = 0;
  proc.onaudioprocess = (ev) => { const d = new Float32Array(ev.inputBuffer.getChannelData(0)); chunks.push(d); count += d.length; };
  src.connect(proc); proc.connect(ctx.destination);
  const total = (guard + meas) * 1000, t0 = performance.now();
  const tick = setInterval(() => { $('lvProg').style.width = Math.min(100, (performance.now() - t0) / total * 100) + '%'; }, 200);
  let from = 0, end = 0, alive = true;
  try {
    $('lvPhase').textContent = T.lvPh;
    await api(`api/zones/${z.index}/level`, { on: true });
    await sleep(guard * 1000); from = count;
    await sleep(meas * 1000); end = count;
    alive = await stillPlaying(z.index);
  } finally {
    await api(`api/zones/${z.index}/level`, { on: false });
    stopTrack('levelAudio', track.started);
    clearInterval(tick); proc.disconnect(); src.disconnect();
    stream.getTracks().forEach(t => t.stop()); await ctx.close();
    $('lvStart').disabled = false;
  }
  const x = new Float32Array(end); let o = 0;
  for (const c of chunks) { if (o >= end) break; x.set(c.subarray(0, Math.min(c.length, end - o)), o); o += c.length; }
  if (!alive) { $('lvPhase').textContent = T.interrupted; return; }
  const r = analyseLevel(x, sr, from, end);
  $('lvPhase').textContent = '';
  const good = r.ok && r.snr >= 12;
  $('lvResult').hidden = false;
  if (!r.ok) {
    $('lvBig').textContent = '–'; $('lvBig').className = 'big warn';
    $('lvText').textContent = ''; $('lvQual').textContent = T.lvBad;
    $('lvApply').disabled = true; lvSuggested = null; return;
  }
  const d = Math.round(r.diff * 10) / 10;
  const want = Math.round((z.trim_db - d) * 10) / 10;
  // "fits" also when the speaker is a little too quiet but can't go louder
  const fits = good && (Math.abs(d) <= TOL_DB || (z.trim_db >= 0 && d < 0 && d >= -TOL_DB));
  lvSuggested = fits ? z.trim_db : Math.max(-30, Math.min(0, want));
  $('lvBig').textContent = fits ? T.lvFits(d) : (d > 0 ? T.lvLouder(d) : T.lvQuieter(-d));
  $('lvBig').className = 'big ' + (good ? 'ok' : 'warn');
  $('lvText').innerHTML = (fits ? T.lvKeep(lvSuggested) : T.lvSuggest(lvSuggested)) +
    (!fits && want > TOL_DB ? '<br><span class="warn">' + T.lvBoost(want, z.speaker_volume) + '</span>' : '');
  $('lvQual').textContent = T.lvQual(r.snr) + (good ? '' : ' — ' + T.lvBad);
  $('lvApply').textContent = fits ? T.confirm : T.apply;
  $('lvApply').disabled = !good;
}

async function setTrim(value, save) {
  const z = zone(); if (!z) return null;
  const r = await api(`api/zones/${z.index}/trim`, { trim_db: value, save });
  const j = await r.json(); await refresh(); return j;
}
$('lvStart').onclick = measureLevel;
$('lvAgain').onclick = measureLevel;
$('lvApply').onclick = async () => {
  if (lvSuggested === null) return;
  const keep = lvSuggested === zone()?.trim_db;
  const j = await setTrim(lvSuggested, true);
  if (j) $('lvApplied').textContent = keep ? T.lvConfirmed(j.trim_db, j.saved) : T.lvApplied(j.trim_db, j.saved);
};
document.querySelectorAll('[data-trim]').forEach(b => b.onclick = async () => {
  const z = zone(); if (!z) return;
  await setTrim(Math.max(-30, Math.min(0, Math.round((z.trim_db + Number(b.dataset.trim)) * 10) / 10)), false);
});
$('lvSave').onclick = async () => { const z = zone(); if (z) await setTrim(z.trim_db, true); };

async function setOffset(value, save) {
  const z = zone(); if (!z) return null;
  const r = await api(`api/zones/${z.index}/offset`, { offset_ms: value, save });
  const j = await r.json(); await refresh(); return j;
}
$('start').onclick = measure;
$('again').onclick = measure;
$('apply').onclick = async () => {
  if (suggested === null) return;
  const keep = suggested === zone()?.offset_ms;
  const j = await setOffset(Math.max(-1000, Math.min(1000, suggested)), true);
  if (j) $('applied').textContent = keep ? T.confirmed(j.offset_ms, j.saved) : T.applied(j.offset_ms, j.saved);
};
document.querySelectorAll('[data-step]').forEach(b => b.onclick = async () => {
  const z = zone(); if (!z) return;
  await setOffset(Math.max(-1000, Math.min(1000, z.offset_ms + Number(b.dataset.step))), false);
});
$('saveManual').onclick = async () => { const z = zone(); if (z) await setOffset(z.offset_ms, true); };
