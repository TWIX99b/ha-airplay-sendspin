name: AirPlay 2 → Sendspin Bridge
version: "0.7.0"
slug: airplay2_sendspin_bridge
description: >-
  Turns Sendspin speakers (e.g. Echos with echo-dot-assist) into real AirPlay 2
  receivers that iOS can group with HomePod and Sonos.
url: https://github.com/TWIX99b/ha-airplay-sendspin
image: ghcr.io/twix99b/{arch}-addon-airplay2-sendspin-bridge
stage: experimental
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
host_network: true
privileged:
  - NET_ADMIN
  - SYS_ADMIN
homeassistant_api: true
services:
  - mqtt:want
hassio_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:speaker-wireless
panel_title: AirPlay Bridge
options:
  ap2_ip: ""
  ap2_gateway: ""
  ap2_interface: ""
  latency_ms: 500
  sendspin_port: 8937
  idle_timeout_s: 4
  volume_range_db: 30
  ignore_airplay_volume: false
  speaker_volume: 100
  lower_volume_during_voice: true
  report_model: true
  metadata: true
  mqtt: true
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_tls: false
  log_level: info
  zones: []
schema:
  ap2_ip: match(^$|^\d{1,3}(\.\d{1,3}){3}/\d{1,2}$)
  ap2_gateway: match(^$|^\d{1,3}(\.\d{1,3}){3}$)
  ap2_interface: str?
  latency_ms: int(150,3000)
  sendspin_port: port
  idle_timeout_s: int(1,60)
  volume_range_db: int(20,90)
  ignore_airplay_volume: bool
  speaker_volume: int(0,100)
  lower_volume_during_voice: bool
  report_model: bool
  metadata: bool
  mqtt: bool
  mqtt_host: str?
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  mqtt_tls: bool
  log_level: list(debug|info|warning|error)
  zones:
    - name: str
      host: str
      port: port
      path: str?
      pairing_token: password?
      token_entity: str?
      latency_offset_ms: int(-1000,1000)?
      volume_trim_db: float(-30,0)?
      satellite_entity: str?
      partner_host: str?
      partner_port: port?
      partner_path: str?
      partner_pairing_token: password?
      partner_token_entity: str?
      partner_satellite_entity: str?
      speaker_volume: int(0,100)?
      night_volume: int(0,100)?
      night_start: str?
      night_end: str?
